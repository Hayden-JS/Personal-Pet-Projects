<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPP Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0c0d0b;--card:#181a16;--line:#2e3229;--fg:#c9dcc2;--dim:#7d9476;--accent:#8dff8d;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "IBM Plex Mono",ui-monospace,monospace;padding:48px 16px}
main{max-width:640px;margin:0 auto}
h1{font:400 56px/1 "VT323",monospace;color:var(--accent);margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--dim);margin:0 0 36px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.name{font:400 30px/1 "VT323",monospace;color:var(--accent)}
.desc{color:var(--dim);font-size:13px;margin-top:6px}
footer{margin-top:40px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>PERSONAL PET PROJECTS</h1>
  <p class="sub">Small things built for fun by Hayden Schwarz.</p>
  <ul>
    <li><a class="card" href="snake/">
      <div class="name">SNAKE · CRT EDITION</div>
      <div class="desc">Retro low-res Snake with 1P solo and 2P co-op. Arrow keys, WASD, or swipe on a phone.</div>
    </a></li>
  </ul>
  <footer>PPP-Projects</footer>
</main>
</body>
</html>
